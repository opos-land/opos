name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # turbo --affected diffs against main and needs the history
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: docker compose up -d --wait db
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm turbo run typecheck lint test ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          # --affected diffs against the PR base branch, not always main
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
