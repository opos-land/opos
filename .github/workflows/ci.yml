name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

# Every job reads the repository and nothing more; a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# mise installs every tool of mise.toml but these: no job runs a deploy command, and the secrets job
# enables gitleaks itself
env:
  MISE_DISABLE_TOOLS: aqua:opentofu/opentofu,aqua:gruntwork-io/terragrunt,aqua:scaleway/scaleway-cli,aqua:cli/cli,aqua:rhysd/actionlint,aqua:koalaman/shellcheck,aqua:gitleaks/gitleaks
  # Every download is checked against its checksum in mise.lock, and a tool missing there fails
  MISE_LOCKED: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    # The remote cache of turbo comes from an environment OpenTofu writes. Only a push to develop or
    # main can enter cache-write, by the environment's own branch policy; any other run of this
    # repository gets cache-read, and a fork or Dependabot no secret, so turbo then works with the
    # local cache alone. Neither is a deployment.
    environment:
      name: ${{ github.event_name == 'push' && 'cache-write' || 'cache-read' }}
      deployment: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # turbo --affected diffs against main and needs the history
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
      # Dependabot does not read mise.toml: the tools with a release past the release age of the
      # dependencies are named in one warning on the pull request. Failing to look warns and fails
      # nothing.
      - if: github.event_name == 'pull_request'
        run: |
          if ! outdated=$(mise outdated --bump --json) ||
            ! newer=$(jq -r 'to_entries
              | map(select(.value.bump != null and .value.bump != .value.requested))
              | map("\(.key) \(.value.requested) → \(.value.bump)") | join(", ")' <<<"$outdated"); then
            echo "::warning file=mise.toml,title=Tools not checked::mise could not read the releases of the tools"
            exit 0
          fi
          if [ -n "$newer" ]; then
            echo "::warning file=mise.toml,title=Newer tools past the release age::$newer"
          fi
        env:
          MISE_MINIMUM_RELEASE_AGE: 7d
          MISE_DISABLE_TOOLS: ''
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Every dependency comes under an allowed licence (docs/ARCHITECTURE.md, Tooling and versions)
      - run: pnpm deps:licenses
      - run: pnpm format:check
      - run: pnpm test:scripts
      - run: node .claude/skills/docs-sync/scripts/check-doc-links.mjs
      # Code travels with its test (AGENTS.md). A pull request into main brings develop's commits,
      # each checked on its way into develop.
      - if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: node scripts/tests-first.mjs --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      # The migration journal against the base branch of a pull request, and against the commit
      # before a push: two pull requests that are valid alone can break the journal once both merge,
      # and only the push sees both. A push that creates a branch has no commit before it.
      - if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check-migrations.mjs --base "$BEFORE_SHA"
        env:
          BEFORE_SHA: ${{ github.event.before }}
      - run: pnpm i18n:check
      # The .env files, the signing key, the CLI's local stack and the roles
      - run: pnpm stack:init
      - run: pnpm db:migrate
      - run: pnpm db:verify
      # The second run fails where a constraint refuses a row; packages/db/test/seed.test.ts holds
      # the row counts across two runs
      - run: pnpm db:seed && pnpm db:seed
      - run: pnpm turbo run typecheck lint ${TURBO_ARGS:+"$TURBO_ARGS"}
        env:
          # A pull request runs what it affects, a push runs everything and runs it uncached
          TURBO_ARGS: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          TURBO_FORCE: ${{ github.event_name == 'push' }}
          # --affected diffs against the PR base branch, not always main
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # The remote cache: without a token turbo leaves it out; an empty mode would turn every
          # cache off, the local one too
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: opos
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
      # In a step of their own: this runner also hosts the stack, and the type checker and the linter
      # would take the time the tests' deadlines count on. The frontends test in the frontend job.
      - run: pnpm turbo run test '--filter=!@opos/admin' '--filter=!@opos/panel' '--filter=!@opos/portal' ${TURBO_ARGS:+"$TURBO_ARGS"}
        env:
          TURBO_ARGS: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          TURBO_FORCE: ${{ github.event_name == 'push' }}
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: opos
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
      # The control address and the canary make the bundle scan below prove something: a bundle
      # without the address was not built from this tree, and one with the secret leaks it
      - run: pnpm build
        env:
          VITE_API_URL: https://opos-control.invalid
          SUPABASE_SECRET_KEY: opos-canary-secret-x
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: opos
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
      # The sources and the bundles of the three frontends name nothing of Supabase
      - run: node scripts/bff-boundary.mjs --dist
      # The tests run the sources; this starts the bundle that production runs
      - name: start the built api
        run: |
          NODE_ENV=production node --env-file=apps/api/.env apps/api/dist/main.js &
          for _ in $(seq 30); do
            curl -fsS http://localhost:3001/health && exit 0
            sleep 1
          done
          exit 1

  # The tests of the three frontends, which need no stack: on check's runner, which hosts it, they
  # would take the cores the API tests and their deadlines count on. The same remote cache as check.
  frontend:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'cache-write' || 'cache-read' }}
      deployment: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # turbo --affected diffs against the base branch and needs the history
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-frontend-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-frontend-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@opos/admin --filter=@opos/panel --filter=@opos/portal ${TURBO_ARGS:+"$TURBO_ARGS"}
        env:
          TURBO_ARGS: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          TURBO_FORCE: ${{ github.event_name == 'push' }}
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: opos
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}

  # Whether a pull request changes anything e2e reads (scripts/e2e-scope.mjs). On a push the job runs
  # with no step and answers nothing, so e2e runs: a skipped job here would skip the release too,
  # which waits on e2e.
  scope:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.e2e.outputs.e2e }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          # The diff counts from the merge base with the base branch
          fetch-depth: 0
      # Node of the runner: the script needs no dependency
      - id: e2e
        if: github.event_name == 'pull_request'
        run: node scripts/e2e-scope.mjs --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  # Skipped by its `if`, the job passes the check the ruleset requires; it runs whenever scope did
  # not answer false: on a push, and when scope failed
  e2e:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
      - run: pnpm install --frozen-lockfile
      # The applications' dev addresses
      - run: echo '127.0.0.1 api.opos.localhost panel.opos.localhost admin.opos.localhost opos.localhost' | sudo tee -a /etc/hosts
      # The .env files, the signing key, the CLI's local stack and the roles
      - run: pnpm stack:init
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @opos/e2e exec playwright install --with-deps chromium
      # Playwright starts the api and the three frontends itself (e2e/playwright.config.ts)
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  # The images of a deployment, built as the server builds them, and what a build alone does not
  # show: the API finds its imports, the frontends serve their routes and ask for basic auth when
  # given a password (infra/docker/check.sh). The deployed images are built on the server.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: infra/docker/check.sh

  # Dev runs the head of develop once its checks passed, through a push signed for Coolify
  # (_coolify-release.yml); release-dev.yml does the same by hand
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [check, frontend, e2e, images, secrets]
    # The called job reads the webhook secret of its environment only when the caller passes its
    # secrets on
    uses: ./.github/workflows/_coolify-release.yml
    secrets: inherit

  # Secrets in the tree and in the whole history, and dependencies with a known high advisory.
  secrets:
    runs-on: ubuntu-latest
    # The workflow's list without gitleaks, which mise installs at the version of mise.toml
    env:
      MISE_DISABLE_TOOLS: aqua:opentofu/opentofu,aqua:gruntwork-io/terragrunt,aqua:scaleway/scaleway-cli,aqua:cli/cli,aqua:rhysd/actionlint,aqua:koalaman/shellcheck
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # gitleaks git walks every commit the checked commit carries
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
      # gitleaks' default rules leave node_modules out of the tree scan
      - run: gitleaks dir . --redact --no-banner
      # The history of the checked commit alone: on a pull request the merge, so what it would bring
      # into its base; on a push the pushed commit. Every other branch the checkout fetched is that
      # branch's own run to scan, and never fails this one.
      - run: gitleaks git . --redact --no-banner --log-opts="--full-history HEAD"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
