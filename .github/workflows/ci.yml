name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # turbo --affected diffs against main and needs the history
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test:scripts
      # RLS and RBAC code travels with its test (AGENTS.md)
      - if: github.event_name == 'pull_request'
        run: node scripts/tests-first.mjs --base origin/${{ github.base_ref }}
      - run: pnpm i18n:check
      # mailpit: the send-email hook test reads what the API sent
      - run: docker compose up -d --wait db auth mailpit
      - run: pnpm db:migrate
      - run: pnpm db:verify
      # The second run proves the seed is idempotent
      - run: pnpm db:seed && pnpm db:seed
      - run: pnpm turbo run typecheck lint test ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          # --affected diffs against the PR base branch, not always main
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - run: pnpm build
      # The tests run the sources; this starts the bundle that production runs
      - name: start the built api
        run: |
          NODE_ENV=production node --env-file=apps/api/.env.example apps/api/dist/main.js &
          for _ in $(seq 30); do
            curl -fsS http://localhost:3001/health && exit 0
            sleep 1
          done
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      # The applications' dev addresses (docs/PLAN.md, 12. Local development)
      - run: echo '127.0.0.1 api.localhost panel.localhost opos.localhost' | sudo tee -a /etc/hosts
      - run: docker compose up -d --wait db auth mailpit
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @opos/e2e exec playwright install --with-deps chromium
      # Playwright starts the api, the panel and the portal itself (e2e/playwright.config.ts)
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
