name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

# Every job reads the repository and nothing more; a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# mise installs every tool of mise.toml but these: no job runs a deploy command
env:
  MISE_DISABLE_TOOLS: aqua:opentofu/opentofu,aqua:gruntwork-io/terragrunt,aqua:scaleway/scaleway-cli,aqua:cli/cli,aqua:rhysd/actionlint,aqua:koalaman/shellcheck

jobs:
  check:
    runs-on: ubuntu-latest
    # The remote cache of turbo comes from an environment OpenTofu writes. Only a push to develop or
    # main can enter cache-write, by the environment's own branch policy; any other run of this
    # repository gets cache-read, and a fork or Dependabot no secret, so turbo then works with the
    # local cache alone. Neither is a deployment.
    environment:
      name: ${{ github.event_name == 'push' && 'cache-write' || 'cache-read' }}
      deployment: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # turbo --affected diffs against main and needs the history
          fetch-depth: 0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test:scripts
      - run: node .claude/skills/docs-sync/scripts/check-doc-links.mjs
      # Code travels with its test (AGENTS.md). A pull request into main brings develop's commits,
      # each checked on its way into develop.
      - if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: node scripts/tests-first.mjs --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      # The migration journal against the base branch of a pull request, and against the commit
      # before a push: two pull requests that are valid alone can break the journal once both merge,
      # and only the push sees both. A push that creates a branch has no commit before it.
      - if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check-migrations.mjs --base "$BEFORE_SHA"
        env:
          BEFORE_SHA: ${{ github.event.before }}
      - run: pnpm i18n:check
      # The .env files, the signing key, the CLI's local stack and the roles
      - run: pnpm infra:init
      - run: pnpm db:migrate
      - run: pnpm db:verify
      # The second run fails where a constraint refuses a row; packages/db/test/seed.test.ts holds
      # the row counts across two runs
      - run: pnpm db:seed && pnpm db:seed
      - run: pnpm turbo run typecheck lint ${TURBO_ARGS:+"$TURBO_ARGS"}
        env:
          # A pull request runs what it affects, a push runs everything and runs it uncached
          TURBO_ARGS: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          TURBO_FORCE: ${{ github.event_name == 'push' }}
          # --affected diffs against the PR base branch, not always main
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # The remote cache: without a token turbo leaves it out; an empty mode would turn every
          # cache off, the local one too
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: opos
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
      # In a step of their own: this runner also hosts the stack, and the type checker and the linter
      # would take the time the tests' deadlines count on
      - run: pnpm turbo run test ${TURBO_ARGS:+"$TURBO_ARGS"}
        env:
          TURBO_ARGS: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          TURBO_FORCE: ${{ github.event_name == 'push' }}
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: opos
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
      # The control address and the canary make the bundle scan below prove something: a bundle
      # without the address was not built from this tree, and one with the secret leaks it
      - run: pnpm build
        env:
          VITE_API_URL: https://opos-control.invalid
          SUPABASE_SECRET_KEY: opos-canary-secret-x
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: opos
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
      # The sources and the bundles of the three frontends name nothing of Supabase
      - run: node scripts/bff-boundary.mjs --dist
      # The tests run the sources; this starts the bundle that production runs
      - name: start the built api
        run: |
          NODE_ENV=production node --env-file=apps/api/.env apps/api/dist/main.js &
          for _ in $(seq 30); do
            curl -fsS http://localhost:3001/health && exit 0
            sleep 1
          done
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
      - run: pnpm install --frozen-lockfile
      # The applications' dev addresses
      - run: echo '127.0.0.1 api.opos.localhost panel.opos.localhost admin.opos.localhost opos.localhost' | sudo tee -a /etc/hosts
      # The .env files, the signing key, the CLI's local stack and the roles
      - run: pnpm infra:init
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @opos/e2e exec playwright install --with-deps chromium
      # Playwright starts the api and the three frontends itself (e2e/playwright.config.ts)
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  # The images of a deployment, built as the server builds them, and what a build alone does not
  # show: the API finds its imports, the frontends serve their routes and ask for basic auth when
  # given a password (infra/docker/check.sh). The deployed images are built on the server.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: infra/docker/check.sh

  # Dev runs the head of develop once its checks passed: this job sends Coolify a push of its
  # commit, signed with the application's webhook secret, and Coolify builds that commit on the
  # server, runs the database steps and starts it. Coolify's API answers only the addresses its
  # allowlist names, which leaves out GitHub's runners, so the job sees the deployment queued and
  # Coolify shows how it ends. A run releases only while its commit is still the head; a newer push
  # releases itself (docs/adr/0075-release-dev-from-ci-through-a-signed-webhook.md). The environment
  # dev admits develop alone; OpenTofu writes its secret and variables.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [check, e2e, images, secrets]
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.DEPLOYMENT_URL }}
    timeout-minutes: 5
    steps:
      - name: release the head of develop
        # Named, bash runs with pipefail: a failed command of a pipe fails the step
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
        run: |
          head=$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          if [ "$head" != "$COMMIT" ]; then
            echo "::notice::$BRANCH has moved on to $head, whose run releases it"
            exit 0
          fi

          # What Coolify reads of a push: the branch, the commit to build and the repository
          payload=$(jq -cn --arg ref "refs/heads/$BRANCH" --arg commit "$COMMIT" --arg repository "$REPOSITORY" \
            '{ref: $ref, after: $commit, repository: {full_name: $repository}}')
          # GitHub's signature: the HMAC-SHA256 of the body as sent, keyed by the secret, which python
          # reads from the environment rather than a command line
          signature=$(printf '%s' "$payload" | python3 -I -c '
          import hashlib, hmac, os, sys
          print(hmac.new(os.environ["COOLIFY_WEBHOOK_SECRET"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')

          reply=$(curl -fsS --retry 3 -X POST "$COOLIFY_URL/webhooks/source/github/events/manual" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$payload")

          # One entry per application Coolify matched. It matches those that follow this branch of
          # this repository, and answers alike when none does and when the signature is wrong: Dev
          # runs another ref, set by an operator (deploy:apply --ref), or the secret is not the
          # application's
          deployment=$(jq -r 'map(select(.status == "success"))[0].deployment_uuid // empty' <<<"$reply" 2>/dev/null || true)
          if [ -z "$deployment" ]; then
            echo "::error::Coolify queued no deployment: $reply"
            exit 1
          fi
          echo "Coolify queued deployment $deployment of $COMMIT; how it ends is in Coolify"

  # Secrets in the tree and in the whole history, and dependencies with a known high advisory.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # gitleaks git walks every commit the checked commit carries
          fetch-depth: 0
      # The release binary, checked against its published checksum. Both scans run before the
      # install, so that node_modules is not scanned.
      - name: install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: gitleaks dir . --redact --no-banner
      # The history of the checked commit alone: on a pull request the merge, so what it would bring
      # into its base; on a push the pushed commit. Every other branch the checkout fetched is that
      # branch's own run to scan, and never fails this one.
      - run: gitleaks git . --redact --no-banner --log-opts="--full-history HEAD"
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
