name: coolify-release

# Dev runs the head of develop: this workflow sends Coolify a push of the commit its caller checked,
# signed with the application's webhook secret, and Coolify builds that commit on the server, runs
# the database steps and starts it. Coolify's API answers only the addresses its allowlist names,
# which leaves out GitHub's runners, so the job sees the deployment queued and Coolify shows how it
# ends. A run releases only while its commit is still the head; a newer push releases itself
# (docs/adr/0075-release-dev-from-ci-through-a-signed-webhook.md). The environment dev admits
# develop alone; OpenTofu writes its secret and variables. ci.yml calls it once the checks of a push
# passed, release-dev.yml when started by hand.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.DEPLOYMENT_URL }}
    timeout-minutes: 5
    steps:
      - name: release the head of develop
        # Named, bash runs with pipefail: a failed command of a pipe fails the step
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
        run: |
          head=$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          if [ "$head" != "$COMMIT" ]; then
            echo "::notice::$BRANCH has moved on to $head, whose run releases it"
            exit 0
          fi

          # What Coolify reads of a push: the branch, the commit to build and the repository
          payload=$(jq -cn --arg ref "refs/heads/$BRANCH" --arg commit "$COMMIT" --arg repository "$REPOSITORY" \
            '{ref: $ref, after: $commit, repository: {full_name: $repository}}')
          # GitHub's signature: the HMAC-SHA256 of the body as sent, keyed by the secret, which python
          # reads from the environment rather than a command line
          signature=$(printf '%s' "$payload" | python3 -I -c '
          import hashlib, hmac, os, sys
          print(hmac.new(os.environ["COOLIFY_WEBHOOK_SECRET"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')

          reply=$(curl -fsS --retry 3 -X POST "$COOLIFY_URL/webhooks/source/github/events/manual" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$payload")

          # One entry per application Coolify matched. It matches those that follow this branch of
          # this repository, and answers alike when none does and when the signature is wrong: Dev
          # runs another ref, set by an operator (deploy:apply --ref), or the secret is not the
          # application's
          deployment=$(jq -r 'map(select(.status == "success"))[0].deployment_uuid // empty' <<<"$reply" 2>/dev/null || true)
          if [ -z "$deployment" ]; then
            echo "::error::Coolify queued no deployment: $reply"
            exit 1
          fi
          echo "Coolify queued deployment $deployment of $COMMIT; how it ends is in Coolify"
