# Dev infrastructure: Supabase Postgres + Auth, Studio, Mailpit. Applications run natively.
# Image tags follow Supabase's self-hosting compose; bump db and auth together.
# Host ports come from OPOS_*_PORT in the shell environment, standard ports by default
# (docs/PLAN.md, 12. Local development).

name: opos

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
      JWT_EXP: 900
      OPOS_MIGRATOR_PASSWORD: opos
      OPOS_APP_PASSWORD: opos
      OPOS_APP_GLOBAL_PASSWORD: opos
    volumes:
      - ./infra/supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro,z
      - ./infra/supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro,z
      - ./infra/supabase/db/opos-roles.sql:/docker-entrypoint-initdb.d/migrations/99-opos-roles.sql:ro,z
      - pgdata:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    ports:
      - 127.0.0.1:${OPOS_DB_PORT:-5432}:5432
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # .env.example holds the dev defaults; an optional .env overrides them per developer.
    env_file:
      - ./infra/supabase/.env.example
      - path: ./infra/supabase/.env
        required: false
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${OPOS_AUTH_PORT:-9999}
      GOTRUE_JWT_ISSUER: http://localhost:${OPOS_AUTH_PORT:-9999}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://opos.localhost:${OPOS_PORTAL_PORT:-5174}
      GOTRUE_URI_ALLOW_LIST: http://opos.localhost:${OPOS_PORTAL_PORT:-5174}/auth/callback,http://opos.localhost:${OPOS_PORTAL_PORT:-5174}/reset-password,http://panel.localhost:${OPOS_PANEL_PORT:-5173}/auth/callback
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 900
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_OTP_EXP: 3600
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: 'true'
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://localhost:${OPOS_AUTH_PORT:-9999}/callback
      GOTRUE_HOOK_SEND_EMAIL_ENABLED: 'true'
      GOTRUE_HOOK_SEND_EMAIL_URI: http://host.docker.internal:${OPOS_API_PORT:-3001}/hooks/send-email
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
      # One bucket for the whole instance, checked before the send-email hook (PLAN.md 10, Rate
      # limits); the tests send more than production's 1000 per hour.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 10000
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${OPOS_AUTH_PORT:-9999}:9999
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 10

  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
      CRYPTO_KEY: dev-pg-meta-crypto-key-32-characters
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then((r) => { if (r.status !== 200) throw new Error(r.status) })",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s

  studio:
    image: supabase/studio:2026.10.12-sha-3699278
    restart: unless-stopped
    depends_on:
      - meta
    environment:
      HOSTNAME: 0.0.0.0
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      STUDIO_PG_META_URL: http://meta:8080
      PG_META_CRYPTO_KEY: dev-pg-meta-crypto-key-32-characters
      POSTGRES_USER_READ_WRITE: postgres
      DEFAULT_ORGANIZATION_NAME: OPOS
      DEFAULT_PROJECT_NAME: opos-dev
      ENABLED_FEATURES_LOGS_ALL: 'false'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/platform/profile').then((r) => { if (r.status !== 200) throw new Error(r.status) })",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - 127.0.0.1:${OPOS_STUDIO_PORT:-54323}:3000

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - 127.0.0.1:${OPOS_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${OPOS_MAILPIT_PORT:-8025}:8025

volumes:
  pgdata:
  db-config:
