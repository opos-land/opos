# The Dev environment: where it runs, what it runs once whatever the number of its deployments,
# such as the build cache of CI and its mail, its deployment, and what CI reads of it in GitHub.
# Plain settings and the names of secrets; no secret value ever enters this file.

scaleway:
  # Dev's project, and the name of the operator's profile of scw for it (mise run deploy:login)
  project: opos-land-dev
  project_id: 2d3fabfb-26a8-4093-99bb-06d40947489d
  region: fr-par

dns:
  # A domain the project holds as an external domain (infra/bootstrap.sh); its own zone holds Dev's
  # records, and NS records in the zone of its parent delegate it
  zone: dev.opos.land

github:
  repository: opos-land/opos

coolify:
  # The dashboard's address, the server's id in Coolify (Servers, then the server's page) and its
  # public addresses
  endpoint: https://raiden.yavi.eu/
  server_uuid: r4kwokc880gc0kc0sc8socw8
  ipv4: 37.187.152.55
  ipv6: 2001:41d0:a:5837::1
  # The project in Coolify that holds Dev, made by the server's owner (its id is in the address of
  # its page), and the environment in it for what serves every deployment, as CI's cache; each
  # deployment adds an environment of its own
  project_uuid: 0i9h0toh2qughsiocoa8aiku
  environment: shared
  token_secret: coolify-api-token

cache:
  # ducktors/turborepo-remote-cache 3.0.3
  image: ducktors/turborepo-remote-cache@sha256:2ad6692bf9c5eed7a3c12f606820abd0af3b2b0f081c7d3bf40f2a015fe27a2f
  host_rw: cache.dev.opos.land
  host_ro: cache-ro.dev.opos.land
  # The branches whose runs write to the cache: no other run enters CI's environment cache-write
  write_branches:
    - develop
    - main
  token_rw_secret: turbo-token-rw
  token_ro_secret: turbo-token-ro
  signature_key_secret: turbo-signature-key

mail:
  # Transactional Email sends from the zone itself; the key the API signs in with is made by the
  # shared unit into this secret, and raising its version replaces it
  from: OPOS <no-reply@dev.opos.land>
  smtp_secret: smtp-password
  smtp_key_version: 1

# Dev's Supabase project, made by hand in the Supabase organisation (infra/README.md); OpenTofu
# changes only what is inside it
supabase:
  # The project's reference, in the address of its dashboard
  ref: nyljkucxigkyiucmxdbj
  # Reaches every project of the organisation; read by an operator's run alone
  token_secret: supabase-access-token
  # The secret the API's secret key is written into; raising the version replaces the key
  secret_key_secret: supabase-secret-key
  secret_key_version: 1

# The one deployment of Dev: the portal at the zone itself, then panel., api. and admin. under it.
# The name is its environment's in Coolify, after the branch it runs: never coolify.environment
deployment:
  name: develop
  repository: https://github.com/opos-land/opos
  # Every release runs the head of this branch; mise run deploy:apply dev --ref <ref> runs another
  # branch or tag instead, and CI releases nothing, until an apply without it
  branch: develop
  # The services a deployment has read from the compose file, which Coolify takes a host for: none
  # before the first deployment has finished, and a new service once one has run with it
  loaded_services: [admin, api, mail, panel, portal]
  # The API's mail goes to the deployment's own catcher, read at mail.<zone> behind basic auth, and
  # never leaves the server; false sends it through the mail unit's relay
  catch_mail: true
  # The token CI releases with, from the GitHub environment dev, which admits the branch alone:
  # deploy and read, in Dev's project alone
  release_token_secret: coolify-release-token

secrets:
  # A person enters the value: mise run deploy:secret-set dev <name>
  entered:
    - coolify-api-token
    - coolify-release-token
    - supabase-access-token
    - supabase-db-password
    - google-client-id
    - google-client-secret
  # OpenTofu generates the value; raising the number replaces it
  generated:
    turbo-token-rw: 1
    turbo-token-ro: 1
    turbo-signature-key: 1
    opos-app-password: 1
    opos-app-global-password: 1
    opos-admin-password: 1
    send-email-hook-secret: 1
    invite-secret: 1
    # Seals the conventions' payment provider credentials: replacing it leaves every stored
    # account unreadable, to be connected again by its convention
    payment-credentials-key: 1
    basic-auth-password: 1
