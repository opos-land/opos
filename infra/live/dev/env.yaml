# The Dev environment: where it runs, and what it runs once whatever the number of its deployments,
# the build cache of CI and what CI reads of it in GitHub. Plain settings and the names of secrets;
# no secret value ever enters this file.

scaleway:
  # Dev's project, and the name of the operator's profile of scw for it (mise run deploy:login)
  project: opos-land-dev
  project_id: 2d3fabfb-26a8-4093-99bb-06d40947489d
  region: fr-par

dns:
  # A domain the project holds as an external domain (infra/bootstrap.sh); its own zone holds Dev's
  # records, and NS records in the zone of its parent delegate it
  zone: dev.opos.land

github:
  repository: opos-land/opos

coolify:
  # Placeholders until the server is known: the dashboard's address, the server's id in Coolify
  # (Servers, then the server's page) and its public addresses
  endpoint: https://coolify.example.net
  server_uuid: replace-me
  ipv4: 203.0.113.10
  # ipv6: 2001:db8::10
  # The project in Coolify that holds Dev, and the environment in it for what Dev runs once; each
  # deployment adds an environment of its own
  project: opos-dev
  environment: shared
  token_secret: coolify-api-token

cache:
  # ducktors/turborepo-remote-cache 3.0.3
  image: ducktors/turborepo-remote-cache@sha256:2ad6692bf9c5eed7a3c12f606820abd0af3b2b0f081c7d3bf40f2a015fe27a2f
  host_rw: cache.dev.opos.land
  host_ro: cache-ro.dev.opos.land
  # The branches whose runs write to the cache: no other run enters CI's environment cache-write
  write_branches:
    - develop
    - main
  token_rw_secret: turbo-token-rw
  token_ro_secret: turbo-token-ro
  signature_key_secret: turbo-signature-key

secrets:
  # A person enters the value: mise run deploy:secret-set dev <name>
  entered:
    - coolify-api-token
  # OpenTofu generates the value; raising the number replaces it
  generated:
    turbo-token-rw: 1
    turbo-token-ro: 1
    turbo-signature-key: 1
