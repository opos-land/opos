# The Dev environment: where it runs, and what it runs once whatever the number of its deployments,
# the build cache of CI and what CI reads of it in GitHub. Plain settings and the names of secrets;
# no secret value ever enters this file.

scaleway:
  # Dev's project, and the name of the operator's profile of scw for it (mise run deploy:login)
  project: opos-land-dev
  project_id: 2d3fabfb-26a8-4093-99bb-06d40947489d
  region: fr-par

dns:
  # A domain the project holds as an external domain (infra/bootstrap.sh); its own zone holds Dev's
  # records, and NS records in the zone of its parent delegate it
  zone: dev.opos.land

secrets:
  # A person enters the value: mise run deploy:secret-set dev <name>
  entered:
    - coolify-api-token
  # OpenTofu generates the value; raising the number replaces it
  generated:
    turbo-token-rw: 1
    turbo-token-ro: 1
    turbo-signature-key: 1
