# Git hooks.
# Skip for a single call: LEFTHOOK=0 git commit ...

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}
    # Code travels with its test (AGENTS.md)
    - name: tests-first
      run: node scripts/tests-first.mjs --commit-msg {1}

pre-commit:
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,yml,yaml,astro,css}'
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,tsx,astro}'
      # A vendored skill's assets belong to no package and its lint config
      exclude:
        - '.claude/skills/**'
      run: pnpm eslint --fix --max-warnings 0 {staged_files}
      stage_fixed: true
    # Nothing in the panel or the portal names Supabase (docs/ARCHITECTURE.md); other staged files pass
    - name: bff-boundary
      run: node scripts/bff-boundary.mjs {staged_files}
    # Markdown tables are spaced into aligned columns (AGENTS.md, Document style)
    - name: markdown-tables
      glob: '*.md'
      run: node scripts/markdown-tables.mjs {staged_files}
    # Every installed dependency comes under an allowed licence, as the check job of CI checks
    - name: deps-licenses
      glob: 'pnpm-lock.yaml'
      run: node scripts/deps-licenses.mjs
    # The staged changes hold no secret, as the secrets job of CI checks after a push
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

# The API tests need the local stack: pnpm stack:init once in a new checkout, then pnpm stack:up
pre-push:
  jobs:
    # Four tasks of four test workers by default, 16 in all: vitest otherwise starts one per core
    # but one in every package at once, more than a machine holds beside the stack. The
    # environment's VITEST_MAX_WORKERS and TURBO_CONCURRENCY override them.
    - name: typecheck and test
      run: VITEST_MAX_WORKERS="${VITEST_MAX_WORKERS:-4}" pnpm turbo run typecheck test --filter=...[origin/develop] --concurrency="${TURBO_CONCURRENCY:-4}"
    # A merged migration stays as it is, and a new one is newer than all of them
    - name: migration journal
      run: node scripts/check-migrations.mjs --merge-base origin/develop
