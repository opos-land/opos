# Git hooks.
# Skip for a single call: LEFTHOOK=0 git commit ...

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}
    # Code travels with its test (AGENTS.md)
    - name: tests-first
      run: node scripts/tests-first.mjs --commit-msg {1}

pre-commit:
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,yml,yaml,astro,css}'
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,tsx,astro}'
      run: pnpm eslint --fix --max-warnings 0 {staged_files}
      stage_fixed: true
    # Nothing in the panel or the portal names Supabase (docs/PLAN.md 3.2); other staged files pass
    - name: bff-boundary
      run: node scripts/bff-boundary.mjs {staged_files}

# The API tests need the local stack: pnpm infra:init once in a new checkout, then pnpm infra:up
pre-push:
  jobs:
    - name: typecheck and test
      run: pnpm turbo run typecheck test --filter=...[origin/develop]
    # A merged migration stays as it is, and a new one is newer than all of them
    - name: migration journal
      run: node scripts/check-migrations.mjs --merge-base origin/develop
