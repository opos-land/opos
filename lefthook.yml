# Git hooks.
# Skip for a single call: LEFTHOOK=0 git commit ...

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-commit:
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,yml,yaml,astro,css}'
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,tsx,astro}'
      run: pnpm eslint --fix --max-warnings 0 {staged_files}
      stage_fixed: true

# The API tests need the database: pnpm infra:up
pre-push:
  jobs:
    - name: typecheck and test
      run: pnpm turbo run typecheck test --filter=...[origin/develop]
