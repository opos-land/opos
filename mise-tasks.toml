# The root commands as mise tasks: `mise tasks` lists them with what they do, `mise run` opens a
# picker. Each task runs the root script of the same name, which stays the only definition of the
# command and works without mise; extra arguments go through to it. turbo orders and caches what the
# scripts run, so a task declares no sources, outputs or depends. `raw` hands the terminal to the
# command, for turbo's interface and the prompts of drizzle-kit.
# `raw_args` hands every argument, --help too, to a command whose script answers --help, where
# mise would print the task's definition instead.
# A description says what the command does and then its arguments, on one row of a 120-column
# terminal; who may run it and what each flag does belong to its help.
# This file sits outside mise.toml, which turbo hashes: a description changes no cache.

[local]
description = "Run the API, the panel, the portal and the admin application in watch mode"
run = "pnpm local"
raw = true

[build]
description = "Build the API, the panel, the portal and the admin application for production"
run = "pnpm build"
raw = true

[typecheck]
description = "Type-check every package"
run = "pnpm typecheck"
raw = true

[lint]
description = "Lint every package with ESLint"
run = "pnpm lint"
raw = true

[test]
description = "Run the tests of every package; the API and database suites need the local stack (stack:up)"
run = "pnpm test"
raw = true

["test:e2e"]
description = "Run the Playwright tests against the migrated and seeded local stack; never beside test"
run = "pnpm test:e2e"
raw = true

["test:scripts"]
description = "Test the root scripts and the Claude Code hooks and skills, with full coverage of the scripts"
run = "pnpm test:scripts"
raw = true

["i18n:extract"]
description = "Extract the source messages into the .po catalogs"
run = "pnpm i18n:extract"
raw = true

["i18n:compile"]
description = "Compile the .po catalogs of the panel, the portal, the admin application and packages/i18n"
run = "pnpm i18n:compile"
raw = true

["i18n:check"]
description = "Check that the catalogs match the code and every message has its pl translation"
run = "pnpm i18n:check"
raw = true

["db:generate"]
description = "Generate a Drizzle migration from the schema: [--name=<name>]"
run = "pnpm db:generate"
raw = true

["db:migrate"]
description = "Apply the pending Drizzle migrations"
run = "pnpm db:migrate"
raw = true

["db:push"]
description = "Push the schema to the database without writing a migration (drizzle-kit push)"
run = "pnpm db:push"
raw = true

["db:seed"]
description = "Fill a local or dev database with the seed tenants and accounts; safe to run again"
run = "pnpm db:seed"
raw = true

["db:roles"]
description = "Set up the runtime database roles with their passwords and defaults"
run = "pnpm db:roles"
raw = true

["db:studio"]
description = "Open Drizzle Studio on the database"
run = "pnpm db:studio"
raw = true

["db:verify"]
description = "Check every table's tenant isolation and that each role holds only the privileges it may"
run = "pnpm db:verify"
raw = true

["db:admin:grant"]
description = "Grant the admin role to an account with a password and two-factor on: --email <email>"
run = "pnpm db:admin:grant"
raw = true

["db:admin:revoke"]
description = "Take the admin role away from an account: --email <email>"
run = "pnpm db:admin:revoke"
raw = true

["db:totp"]
description = "Print the current two-factor code of an account, where OPOS_ENV is local alone: --email <email>"
run = "pnpm db:totp"
raw = true

[format]
description = "Format every file with Prettier and space the tables of the Markdown files"
run = "pnpm format"
raw = true

["format:check"]
description = "Check that every file is formatted with Prettier and every Markdown table is spaced"
run = "pnpm format:check"
raw = true

["stack:init"]
description = "Set up the local stack once per checkout: .env files, keys, containers and database roles"
run = "pnpm stack:init"
raw = true

["stack:up"]
description = "Start the local Supabase stack, the bucket and the image server"
run = "pnpm stack:up"
raw = true

["stack:down"]
description = "Stop the local Supabase stack, the bucket and the image server, keeping their data"
run = "pnpm stack:down"
raw = true

["stack:reset"]
description = "Wipe the local stack's data, start it again and set the database roles"
run = "pnpm stack:reset"
raw = true

# The commands of the code in infra/: they read or build it on this machine, sign in nowhere and
# change no environment. OpenTofu and Terragrunt come from mise. infra:check runs Terragrunt in a
# cache of its own, infra/.terragrunt-cache/check: a unit initialised there without its backend
# would stay so in the deploy commands' cache, and their next plan would fail on "Backend
# initialization required".

["infra:check"]
description = "Check the format of the infrastructure code and validate every unit, without a sign-in"
run = "pnpm infra:check"

["infra:images"]
description = "Build the images as a deployment's server does and try the API and the portal, in Docker"
run = "pnpm infra:images"

["infra:lock"]
description = "Write every module's provider lock file for Linux and macOS after a provider's version changed"
run = "pnpm infra:lock"

["infra:graph"]
description = "Write a page of an environment's deployment and code: <environment> [--open]"
run = "pnpm infra:graph"
raw_args = true

# The deploy commands: root scripts that run scripts/deploy.mjs, which takes the arguments and flags
# itself (docs/adr/0070-run-the-deploy-commands-as-node-scripts.md). OpenTofu, Terragrunt and the
# CLIs of Scaleway and GitHub come from mise. <environment> is a directory of infra/live, whose
# terragrunt.stack.hcl generates its units, and [unit] the name of one of them; without a unit a
# command runs every unit of the environment, in the order of their dependencies, but shared, which
# only an administrator of the organisation applies and only by its name. What reaches the state or
# the secrets runs under the operator's own key. The state is encrypted by OpenTofu, so a unit reads
# another's outputs through OpenTofu and never from the bucket itself.

["deploy:login"]
description = "Sign in to Scaleway and GitHub for an environment's deploy commands: <environment>"
run = "pnpm deploy:login"
raw_args = true
raw = true

["deploy:bootstrap"]
description = "Make an environment's state bucket and passphrase and register its domain: <environment>"
run = "pnpm deploy:bootstrap"
raw_args = true
raw = true

["deploy:access:grant"]
description = "Let people run an environment's deploy commands: <environment> <email>..."
run = "pnpm deploy:access:grant"
raw_args = true
raw = true

["deploy:access:revoke"]
description = "Stop people from running an environment's deploy commands: <environment> <email>..."
run = "pnpm deploy:access:revoke"
raw_args = true
raw = true

["deploy:plan"]
description = "Show what applying an environment would change: <environment> [unit] [--save] [--ref <ref>]"
run = "pnpm deploy:plan"
raw_args = true
raw = true

["deploy:apply"]
description = "Plan, ask, then apply an environment: <environment> [unit] [--saved | --no-plan] [--ref <ref>]"
run = "pnpm deploy:apply"
raw_args = true
raw = true

["deploy:destroy"]
description = "Destroy one unit of an environment after showing its plan and asking: <environment> <unit>"
run = "pnpm deploy:destroy"
raw_args = true
raw = true

["deploy:import"]
description = "Take an object no state holds into a unit's state: <environment> <unit> <address> <id>"
run = "pnpm deploy:import"
raw_args = true
raw = true
hide = true

["deploy:output"]
description = "Print the outputs of an environment's units: <environment> [unit]"
run = "pnpm deploy:output"
raw_args = true
raw = true

["deploy:secret:set"]
description = "Enter the value of a secret a third party issued, without echo: <environment> <name>"
run = "pnpm deploy:secret:set"
raw_args = true
raw = true

["deploy:secret:get"]
description = "Print the current value of one of an environment's secrets: <environment> <name>"
run = "pnpm deploy:secret:get"
raw_args = true
raw = true
