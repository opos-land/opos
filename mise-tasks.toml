# The root commands as mise tasks: `mise tasks` lists them with what they do, `mise run` opens a
# picker. Each task runs the root script of the same name, which stays the only definition of the
# command and works without mise; extra arguments go through to it. turbo orders and caches what the
# scripts run, so a task declares no sources, outputs or depends. `raw` hands the terminal to the
# command, for turbo's interface and the prompts of drizzle-kit. The deploy commands at the end are
# the exception: they have no root script.
# This file sits outside mise.toml, which turbo hashes: a description changes no cache.

[local]
description = "Run the API, the panel, the portal and the admin application in watch mode"
run = "pnpm local"
raw = true

[build]
description = "Build the API, the panel, the portal and the admin application for production"
run = "pnpm build"
raw = true

[typecheck]
description = "Type-check every package"
run = "pnpm typecheck"
raw = true

[lint]
description = "Lint every package with ESLint"
run = "pnpm lint"
raw = true

[test]
description = "Run the tests of every package; the API and database suites need the local stack (infra:up)"
run = "pnpm test"
raw = true

["test:e2e"]
description = "Run the Playwright tests against the migrated and seeded local stack; never beside test"
run = "pnpm test:e2e"
raw = true

["test:scripts"]
description = "Test the root scripts and the Claude Code hooks and skills, with full coverage of the scripts"
run = "pnpm test:scripts"
raw = true

["i18n:extract"]
description = "Extract the source messages into the .po catalogs"
run = "pnpm i18n:extract"
raw = true

["i18n:compile"]
description = "Compile the .po catalogs of the panel, the portal, the admin application and packages/i18n"
run = "pnpm i18n:compile"
raw = true

["i18n:check"]
description = "Check that the catalogs match the code and every message has its pl translation"
run = "pnpm i18n:check"
raw = true

["db:generate"]
description = "Generate a Drizzle migration from the schema; to name it, pnpm --filter @opos/db db:generate --name=<name>"
run = "pnpm db:generate"
raw = true

["db:migrate"]
description = "Apply the pending Drizzle migrations"
run = "pnpm db:migrate"
raw = true

["db:push"]
description = "Push the schema to the database without writing a migration (drizzle-kit push)"
run = "pnpm db:push"
raw = true

["db:seed"]
description = "Fill a local or dev database with the seed tenants and accounts; safe to run again"
run = "pnpm db:seed"
raw = true

["db:roles"]
description = "Set up the runtime database roles with their passwords and defaults"
run = "pnpm db:roles"
raw = true

["db:studio"]
description = "Open Drizzle Studio on the database"
run = "pnpm db:studio"
raw = true

["db:verify"]
description = "Check that every table follows the tenant isolation rules and the roles hold only the privileges they may"
run = "pnpm db:verify"
raw = true

["db:admin:grant"]
description = "Grant the admin role to a confirmed account with a password and two-factor authentication on: --email <email>"
run = "pnpm db:admin:grant"
raw = true

["db:admin:revoke"]
description = "Take the admin role away from an account: --email <email>"
run = "pnpm db:admin:revoke"
raw = true

["db:totp"]
description = "Print the current two-factor code of an account, where OPOS_ENV is local alone: --email <email>"
run = "pnpm db:totp"
raw = true

[format]
description = "Format every file with Prettier and space the tables of the Markdown files"
run = "pnpm format"
raw = true

["format:check"]
description = "Check that every file is formatted with Prettier and every Markdown table is spaced"
run = "pnpm format:check"
raw = true

["infra:init"]
description = "Set up the local stack once per checkout: .env files, secrets, signing key, Supabase, the bucket and the image server, database roles"
run = "pnpm infra:init"
raw = true

["infra:up"]
description = "Start the local Supabase stack, the bucket and the image server"
run = "pnpm infra:up"
raw = true

["infra:down"]
description = "Stop the local Supabase stack, the bucket and the image server, keeping their data"
run = "pnpm infra:down"
raw = true

["infra:reset"]
description = "Wipe the data of the local Supabase stack and the bucket, start them again and set the database roles"
run = "pnpm infra:reset"
raw = true

# The deploy commands: root scripts that run scripts/deploy.mjs, which takes the arguments and flags
# itself (docs/adr/0070-run-the-deploy-commands-as-node-scripts.md). OpenTofu, Terragrunt and the
# CLIs of Scaleway and GitHub come from mise. <environment> is a directory of infra/live, whose
# terragrunt.stack.hcl generates its units, and [unit] the name of one of them; without a unit a
# command runs every unit of the environment, in the order of their dependencies, but shared, which
# only an administrator of the organisation applies and only by its name. What reaches the state or
# the secrets runs under the operator's own key. The state is encrypted by OpenTofu, so a unit reads
# another's outputs through OpenTofu and never from the bucket itself.

["deploy:login"]
description = "Sign in to Scaleway and GitHub as yourself for the deploy commands of an environment; the Scaleway key expires after 12 hours: <environment>"
run = "pnpm deploy:login"
raw = true

["deploy:bootstrap"]
description = "Once per environment, by an administrator of the Scaleway organisation, make the state bucket and its passphrase and the project of the bucket of uploaded files, and register the environment's domain; never by an agent: <environment>"
run = "pnpm deploy:bootstrap"
raw = true

["deploy:grant"]
description = "Let people run the deploy commands of an environment, once its shared unit is applied; run by an administrator of the Scaleway organisation, never by an agent: <environment> <email>..."
run = "pnpm deploy:grant"
raw = true

["deploy:grant:revoke"]
description = "Stop people from running the deploy commands of an environment; run by an administrator of the Scaleway organisation, never by an agent: <environment> <email>..."
run = "pnpm deploy:grant:revoke"
raw = true

["deploy:plan"]
description = "Show what applying an environment would change; --save plans as an apply does and keeps the plans for deploy:apply --saved, --ref <ref> plans another branch or tag: <environment> [unit]"
run = "pnpm deploy:plan"
raw = true

["deploy:apply"]
description = "Plan an environment, ask once, then apply exactly those plans; --saved applies the plans of deploy:plan --save, --no-plan applies in order without showing a plan, --ref <ref> deploys another branch or tag until an apply without it; run by an operator, never by an agent: <environment> [unit]"
run = "pnpm deploy:apply"
raw = true

["deploy:destroy"]
description = "Destroy one unit of an environment, after showing its plan and asking; run by an operator, never by an agent: <environment> <unit>"
run = "pnpm deploy:destroy"
raw = true

["deploy:output"]
description = "Print the outputs of an environment's units: <environment> [unit]"
run = "pnpm deploy:output"
raw = true

["deploy:secret-set"]
description = "Enter the value of a secret a third party issued, read without echo; run by an operator, never by an agent: <environment> <name>"
run = "pnpm deploy:secret-set"
raw = true

["deploy:secret-get"]
description = "Print the current value of one of an environment's secrets; run by an operator, never by an agent: <environment> <name>"
run = "pnpm deploy:secret-get"
raw = true

["deploy:lock"]
description = "Write the provider lock file of every module, for Linux and macOS, after a provider's version changed"
run = 'for module in infra/modules/*/; do tofu -chdir="$module" providers lock -platform=linux_amd64 -platform=linux_arm64 -platform=darwin_arm64 || exit 1; done'

["deploy:images"]
description = "Build the images as a deployment's server does and try the API and the portal; needs Docker and no sign-in"
run = "infra/docker/check.sh"

["deploy:check"]
description = "Check the format of the infrastructure code and validate every unit against its providers and its module's lock file; needs no sign-in"
run = [
  "tofu fmt -check -recursive infra",
  "terragrunt hcl fmt --check --working-dir infra",
  "terragrunt run --all --working-dir infra/live --no-auto-init --non-interactive --no-dependency-outputs -- init -backend=false -input=false -lockfile=readonly",
  "terragrunt run --all --working-dir infra/live --no-auto-init --non-interactive --no-dependency-outputs -- validate",
]
