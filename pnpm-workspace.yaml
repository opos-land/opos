packages:
  - apps/*
  - packages/*
  - e2e

# Never install anything published within the last 7 days (value in minutes).
# A grace window against hijacked publisher accounts and versions pulled right after release.
minimumReleaseAge: 10080

# Versions from the engines field are required, not advisory.
engineStrict: true

allowBuilds:
  lefthook: true
  # swagger-ui-dist telemetry
  '@scarf/scarf': false
  # platform binaries come from optional dependencies, the postinstall only verifies them
  esbuild: false
  unrs-resolver: false

# Versions shared by more than one workspace package.
catalog:
  '@eslint/js': ^10.0.1
  '@lingui/core': ^6.10.0
  '@lingui/vite-plugin': ^6.10.0
  '@nestjs/common': ^11.2.7
  '@nestjs/core': ^11.2.7
  '@nestjs/platform-express': ^11.2.7
  '@nestjs/testing': ^11.2.7
  # The @orpc packages require each other at the exact same version.
  '@orpc/client': ^1.15.7
  '@orpc/contract': ^1.15.7
  '@orpc/nest': ^1.15.7
  '@orpc/openapi': ^1.15.7
  '@orpc/openapi-client': ^1.15.7
  '@orpc/server': ^1.15.7
  '@orpc/zod': ^1.15.7
  '@types/node': ^24.0.0
  drizzle-orm: ^0.45.4
  eslint: ^10.0.0
  globals: ^17.13.0
  postgres: ^3.4.9
  typescript: ~6.0.3
  typescript-eslint: ^8.60.0
  vitest: ^4.1.0
  zod: ^4.6.7
