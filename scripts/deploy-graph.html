<!doctype html>
<!-- The page of pnpm deploy:graph (scripts/deploy-graph.mjs), which puts an environment's stack in
     place of the marker in the data script below. It loads nothing from anywhere else. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stack</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #1b1f24;
        --muted: #5b6573;
        --faint: #8a94a3;
        --border: #d9dee5;
        --chip: #eef1f5;
        --code: #f1f3f6;
        --edge: #8f99a8;
        --accent: #3b5bdb;
        --accent-soft: #e7ecfd;
        --up: #0c8599;
        --up-soft: #e3f6f8;
        --down: #c2410c;
        --down-soft: #fdeee6;
        --warn: #b45309;
        --warn-soft: #fef3e2;
        --match: #7048e8;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --panel: #181c22;
          --text: #e6e9ee;
          --muted: #a3acb9;
          --faint: #6f7987;
          --border: #2c323b;
          --chip: #232932;
          --code: #1f242c;
          --edge: #6b7584;
          --accent: #7c93f5;
          --accent-soft: #232c4d;
          --up: #3bc9db;
          --up-soft: #12343a;
          --down: #fb8c55;
          --down-soft: #3d2418;
          --warn: #f0a742;
          --warn-soft: #3a2a12;
          --match: #a98bff;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      code,
      pre,
      .mono {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
        font-size: 12.5px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 650;
      }
      header .file {
        color: var(--muted);
      }
      header .spacer {
        flex: 1;
      }
      input[type='search'] {
        width: min(320px, 100%);
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      button,
      label.toggle {
        font: inherit;
        color: var(--text);
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      button:hover,
      label.toggle:hover {
        border-color: var(--faint);
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr minmax(340px, 34%);
        min-height: 0;
      }
      #graph {
        position: relative;
        overflow: hidden;
        min-height: 0;
        cursor: grab;
      }
      #graph.panning {
        cursor: grabbing;
      }
      #graph svg {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #panel {
        border-left: 1px solid var(--border);
        background: var(--panel);
        overflow: auto;
        padding: 16px 18px 40px;
        min-height: 0;
      }
      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 55vh auto;
        }
        #panel {
          border-left: 0;
          border-top: 1px solid var(--border);
        }
      }

      /* The graph */
      .node rect {
        fill: var(--panel);
        stroke: var(--border);
        stroke-width: 1.5;
      }
      .node {
        cursor: pointer;
        outline: none;
      }
      .node:hover rect,
      .node:focus-visible rect {
        stroke: var(--faint);
      }
      .node .name {
        font-weight: 650;
        font-size: 14px;
        fill: var(--text);
      }
      .node .sub {
        font-size: 11.5px;
        fill: var(--muted);
      }
      .node .count {
        font-size: 11.5px;
        fill: var(--muted);
      }
      .node .warn {
        font-size: 11.5px;
        fill: var(--warn);
        font-weight: 600;
      }
      .node.selected rect {
        stroke: var(--accent);
        stroke-width: 2.5;
        fill: var(--accent-soft);
      }
      .node.up rect {
        stroke: var(--up);
        fill: var(--up-soft);
      }
      .node.down rect {
        stroke: var(--down);
        fill: var(--down-soft);
      }
      .node.match rect {
        stroke: var(--match);
        stroke-width: 2.5;
      }
      .dim {
        opacity: 0.25;
      }
      .edge path.line {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1.6;
      }
      .edge path.hit {
        fill: none;
        stroke: transparent;
        stroke-width: 14;
        cursor: pointer;
      }
      .edge.order path.line {
        stroke-dasharray: 5 4;
        stroke-width: 1.2;
      }
      .edge.up path.line {
        stroke: var(--up);
        stroke-width: 2.2;
      }
      .edge.down path.line {
        stroke: var(--down);
        stroke-width: 2.2;
      }
      .edge.selected path.line,
      .edge:hover path.line {
        stroke: var(--accent);
        stroke-width: 2.6;
      }
      .edge-label {
        cursor: pointer;
      }
      .edge-label.hidden {
        display: none;
      }
      .edge-label rect {
        fill: var(--panel);
        stroke: var(--border);
      }
      .edge-label text {
        font-size: 11px;
        fill: var(--muted);
      }
      .edge.hidden {
        display: none;
      }
      marker path {
        fill: var(--edge);
      }
      .zoom {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        gap: 6px;
      }

      /* The panel */
      #panel h2 {
        font-size: 18px;
        margin: 0 0 2px;
      }
      #panel h3 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 20px 0 8px;
      }
      #panel p {
        margin: 6px 0;
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 9px;
        font-size: 12.5px;
        color: var(--text);
      }
      button.chip {
        cursor: pointer;
      }
      .chip.up {
        border-color: var(--up);
        background: var(--up-soft);
      }
      .chip.down {
        border-color: var(--down);
        background: var(--down-soft);
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 0 6px;
        border-radius: 4px;
        background: var(--chip);
        color: var(--muted);
        border: 1px solid var(--border);
        vertical-align: 1px;
        white-space: nowrap;
      }
      .tag.warn {
        color: var(--warn);
        border-color: var(--warn);
        background: var(--warn-soft);
      }
      .tag.accent {
        color: var(--accent);
        border-color: var(--accent);
      }
      .warnings {
        background: var(--warn-soft);
        border: 1px solid var(--warn);
        border-radius: 8px;
        padding: 8px 12px;
        margin: 10px 0;
      }
      .warnings ul {
        margin: 4px 0;
        padding-left: 18px;
      }
      details {
        border-top: 1px solid var(--border);
        padding: 4px 0;
      }
      details > summary {
        cursor: pointer;
        font-weight: 600;
        padding: 6px 0;
        list-style-position: outside;
      }
      details > summary .count {
        color: var(--faint);
        font-weight: 400;
        margin-left: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      td,
      th {
        text-align: left;
        vertical-align: top;
        padding: 5px 6px 5px 0;
        border-bottom: 1px solid var(--border);
        overflow-wrap: anywhere;
      }
      th {
        font-weight: 600;
        color: var(--muted);
        font-size: 12px;
      }
      table.auto {
        table-layout: auto;
      }
      td.key {
        width: 38%;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--code);
        border-radius: 6px;
        padding: 4px 6px;
        max-height: 220px;
        overflow: auto;
      }
      code {
        background: var(--code);
        border-radius: 4px;
        padding: 0 4px;
      }
      ol.rounds {
        padding-left: 22px;
        margin: 6px 0;
      }
      ol.rounds li {
        margin: 4px 0;
      }
      ul.plain {
        list-style: none;
        padding: 0;
        margin: 4px 0;
      }
      ul.plain li {
        padding: 3px 0;
      }
      .legend {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 6px 10px;
        align-items: center;
      }
      .swatch {
        width: 30px;
        height: 14px;
        border-radius: 4px;
        border: 2px solid;
      }
      a.link,
      button.link {
        color: var(--accent);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .back {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Stack</h1>
      <span class="file mono" id="file"></span>
      <span class="spacer"></span>
      <input
        id="search"
        type="search"
        placeholder="Search units, resources, variables, values  ( / )"
        aria-label="Search the stack"
      />
      <label class="toggle"><input id="order" type="checkbox" checked /> Order-only edges</label>
    </header>
    <main>
      <div id="graph">
        <svg id="svg" role="img" aria-label="The units of the stack and their dependencies">
          <defs>
            <marker
              id="arrow"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="7"
              markerHeight="7"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" />
            </marker>
          </defs>
          <g id="viewport"></g>
        </svg>
        <div class="zoom">
          <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="fit" title="Fit the graph">Fit</button>
        </div>
      </div>
      <aside id="panel" aria-live="polite"></aside>
    </main>

    <script id="stack" type="application/json">
      /*STACK*/
    </script>
    <script>
      'use strict'
      const stack = JSON.parse(document.getElementById('stack').textContent)
      const SVG = 'http://www.w3.org/2000/svg'
      const units = new Map(stack.units.map((unit) => [unit.name, unit]))
      const layout = stack.layout.nodes
      const state = { selected: null, query: '', order: true }

      document.title = `${stack.environment} stack`
      document.getElementById('title').textContent = `Stack: ${stack.environment}`
      document.getElementById('file').textContent = stack.file

      // ----- small helpers -----------------------------------------------------------------------
      function h(tag, attributes = {}, ...children) {
        const element = document.createElement(tag)
        for (const [key, value] of Object.entries(attributes)) {
          if (value === null || value === undefined || value === false) continue
          if (key.startsWith('on')) element.addEventListener(key.slice(2), value)
          else if (key === 'class') element.className = value
          else element.setAttribute(key, value === true ? '' : value)
        }
        for (const child of children.flat(Infinity)) {
          if (child === null || child === undefined || child === false) continue
          element.append(child instanceof Node ? child : String(child))
        }
        return element
      }
      function s(tag, attributes = {}, ...children) {
        const element = document.createElementNS(SVG, tag)
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value)
        for (const child of children) element.append(child)
        return element
      }
      const format = (value) => (typeof value === 'string' ? value : JSON.stringify(value, null, 2))
      const plural = (count, word, many = `${word}s`) => `${count} ${count === 1 ? word : many}`
      const unitChip = (name, kind) =>
        h('button', { class: `chip ${kind ?? ''}`, onclick: () => select({ unit: name }) }, name)
      const tag = (text, kind = '') => h('span', { class: `tag ${kind}` }, text)
      const section = (title, count, open, ...body) =>
        h(
          'details',
          { open },
          h('summary', {}, title, count === null ? null : h('span', { class: 'count' }, count)),
          ...body,
        )
      const resourceCount = (unit) =>
        unit.module ? unit.module.resources.filter((r) => r.kind === 'resource').length : 0

      // ----- relations ---------------------------------------------------------------------------
      function reach(start, direction) {
        const seen = new Set()
        const queue = [start]
        while (queue.length) {
          const name = queue.shift()
          for (const edge of stack.edges) {
            const [from, to] = direction === 'down' ? [edge.from, edge.to] : [edge.to, edge.from]
            if (from === name && !seen.has(to) && to !== start) {
              seen.add(to)
              queue.push(to)
            }
          }
        }
        return seen
      }
      const edgeId = (edge) => `${edge.from}>${edge.to}`

      // ----- search ------------------------------------------------------------------------------
      function matchesOf(unit, query) {
        if (!query) return []
        const found = []
        const test = (text, what) => {
          if (String(text).toLowerCase().includes(query)) found.push(what)
        }
        test(unit.name, 'name')
        test(unit.source, 'unit source')
        for (const value of unit.values)
          test(
            `${value.key} ${value.known ? format(value.value) : value.expression}`,
            `value ${value.key}`,
          )
        for (const input of unit.inputs) test(input.name, `input ${input.name}`)
        if (unit.module) {
          test(unit.module.path, 'module')
          for (const r of unit.module.resources) test(r.address, r.address)
          for (const v of unit.module.variables) test(v.name, `variable ${v.name}`)
          for (const o of unit.module.outputs) test(o.name, `output ${o.name}`)
          for (const p of unit.module.providers) test(p.source, `provider ${p.source}`)
        }
        return [...new Set(found)]
      }

      // ----- the graph ---------------------------------------------------------------------------
      const viewport = document.getElementById('viewport')
      const nodeElements = new Map()
      const edgeElements = new Map()
      const labelElements = new Map()

      const routes = stack.layout.routes
      // The points an edge passes through: out of its unit, through the slots of the columns it
      // skips, into the other unit
      function ports() {
        // Spread the ends of the edges along a unit's side, in the order of where they head
        const outgoing = new Map()
        const incoming = new Map()
        for (const edge of stack.edges) {
          if (!outgoing.has(edge.from)) outgoing.set(edge.from, [])
          if (!incoming.has(edge.to)) incoming.set(edge.to, [])
          outgoing.get(edge.from).push(edge)
          incoming.get(edge.to).push(edge)
        }
        const centreY = (box) => box.y + box.height / 2
        const nextY = (edge) => routes[edgeId(edge)][0]?.[1] ?? centreY(layout[edge.to])
        const previousY = (edge) => routes[edgeId(edge)].at(-1)?.[1] ?? centreY(layout[edge.from])
        const at = new Map()
        const spread = (map, position, end) => {
          for (const [name, list] of map) {
            list.sort((a, b) => position(a) - position(b))
            const box = layout[name]
            list.forEach((edge, index) => {
              at.set(
                `${edgeId(edge)}:${end}`,
                box.y + (box.height * (index + 1)) / (list.length + 1),
              )
            })
          }
        }
        spread(outgoing, nextY, 'from')
        spread(incoming, previousY, 'to')
        return at
      }

      function pathOf(points) {
        // Curves between columns, straight runs through a slot
        let d = `M ${points[0][0]} ${points[0][1]}`
        for (let index = 1; index < points.length; index++) {
          const [ax, ay] = points[index - 1]
          const [bx, by] = points[index]
          if (ay === by) {
            d += ` L ${bx} ${by}`
          } else {
            const bend = Math.max(30, (bx - ax) / 2)
            d += ` C ${ax + bend} ${ay}, ${bx - bend} ${by}, ${bx} ${by}`
          }
        }
        return d
      }

      function drawGraph() {
        const at = ports()
        const edgeLayer = s('g')
        const labelLayer = s('g')
        const nodeLayer = s('g')
        for (const edge of stack.edges) {
          const a = layout[edge.from]
          const b = layout[edge.to]
          const points = [
            [a.x + a.width, at.get(`${edgeId(edge)}:from`)],
            ...routes[edgeId(edge)],
            [b.x - 2, at.get(`${edgeId(edge)}:to`)],
          ]
          const d = pathOf(points)
          const title = s('title')
          title.textContent =
            edge.kind === 'data'
              ? `${edge.to} reads from ${edge.from}: ${edge.outputs.map((o) => `${o.output} → ${o.input}`).join(', ')}`
              : `${edge.to} is applied after ${edge.from}, reading none of its outputs`
          const group = s(
            'g',
            { class: `edge ${edge.kind}`, 'data-edge': edgeId(edge) },
            title,
            s('path', { class: 'line', d, 'marker-end': 'url(#arrow)' }),
            s('path', { class: 'hit', d }),
          )
          if (edge.kind === 'data') {
            // The count of outputs just before the arrow, on the last curve
            const [ax, ay] = points.at(-2)
            const [bx, by] = points.at(-1)
            const mx = bx - Math.min(46, (bx - ax) * 0.35)
            const my = ay + (by - ay) * 0.93
            const text = String(edge.outputs.length)
            const width = 10 + text.length * 7
            const label = s(
              'g',
              {
                class: 'edge-label',
                'data-edge': edgeId(edge),
                transform: `translate(${mx - width / 2} ${my - 9})`,
              },
              s('rect', { width, height: 18, rx: 9 }),
              s('text', { x: width / 2, y: 13, 'text-anchor': 'middle' }, text),
            )
            label.addEventListener('click', (event) => {
              event.stopPropagation()
              select({ edge: edgeId(edge) })
            })
            labelLayer.append(label)
            labelElements.set(edgeId(edge), label)
          }
          group.addEventListener('click', (event) => {
            event.stopPropagation()
            select({ edge: edgeId(edge) })
          })
          edgeLayer.append(group)
          edgeElements.set(edgeId(edge), group)
        }
        for (const unit of stack.units) {
          const box = layout[unit.name]
          const providers = unit.module ? unit.module.providers.map((p) => p.name).join(' · ') : ''
          const resources = resourceCount(unit)
          const data = unit.module
            ? unit.module.resources.filter((r) => r.kind !== 'resource').length
            : 0
          const counts = unit.module
            ? `${plural(resources, 'resource')}${data ? ` · ${data} data` : ''}`
            : 'module outside this repository'
          const sub = unit.module
            ? unit.module.path.replace(/^infra\/modules\//, 'module ')
            : unit.source
          const children = [
            s('rect', { width: box.width, height: box.height, rx: 10 }),
            s('text', { class: 'name', x: 14, y: 24 }, unit.name),
            s('text', { class: 'sub', x: 14, y: 42 }, sub),
            s('text', { class: 'sub', x: 14, y: 59 }, providers),
            s('text', { class: 'count', x: 14, y: 78 }, counts),
          ]
          if (unit.warnings.length) {
            children.push(
              s(
                'text',
                { class: 'warn', x: box.width - 12, y: 24, 'text-anchor': 'end' },
                plural(unit.warnings.length, 'warning'),
              ),
            )
          }
          const group = s(
            'g',
            {
              class: 'node',
              transform: `translate(${box.x} ${box.y})`,
              tabindex: '0',
              role: 'button',
              'aria-label': `Unit ${unit.name}`,
            },
            ...children,
          )
          group.addEventListener('click', (event) => {
            event.stopPropagation()
            select({ unit: unit.name })
          })
          group.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault()
              select({ unit: unit.name })
            }
          })
          nodeLayer.append(group)
          nodeElements.set(unit.name, group)
        }
        viewport.append(edgeLayer, nodeLayer, labelLayer)
      }

      // ----- pan and zoom ------------------------------------------------------------------------
      const graph = document.getElementById('graph')
      const svg = document.getElementById('svg')
      const view = { x: 0, y: 0, k: 1 }
      const apply = () =>
        viewport.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`)
      function fit() {
        const { width, height } = svg.getBoundingClientRect()
        const k = Math.min(width / stack.layout.width, height / stack.layout.height, 1.4)
        view.k = k > 0 ? k : 1
        view.x = (width - stack.layout.width * view.k) / 2
        view.y = (height - stack.layout.height * view.k) / 2
        apply()
      }
      function zoom(factor, cx, cy) {
        const k = Math.min(3, Math.max(0.25, view.k * factor))
        view.x = cx - ((cx - view.x) * k) / view.k
        view.y = cy - ((cy - view.y) * k) / view.k
        view.k = k
        apply()
      }
      svg.addEventListener(
        'wheel',
        (event) => {
          event.preventDefault()
          const rect = svg.getBoundingClientRect()
          zoom(
            Math.exp(-event.deltaY * 0.0015),
            event.clientX - rect.left,
            event.clientY - rect.top,
          )
        },
        { passive: false },
      )
      let drag = null
      svg.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.node, .edge, .edge-label')) return
        drag = { x: event.clientX, y: event.clientY, vx: view.x, vy: view.y, moved: false }
        graph.classList.add('panning')
        svg.setPointerCapture(event.pointerId)
      })
      svg.addEventListener('pointermove', (event) => {
        if (!drag) return
        const dx = event.clientX - drag.x
        const dy = event.clientY - drag.y
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true
        view.x = drag.vx + dx
        view.y = drag.vy + dy
        apply()
      })
      svg.addEventListener('pointerup', () => {
        if (drag && !drag.moved) select(null)
        drag = null
        graph.classList.remove('panning')
      })
      const centre = () => {
        const rect = svg.getBoundingClientRect()
        return [rect.width / 2, rect.height / 2]
      }
      document.getElementById('zoom-in').addEventListener('click', () => zoom(1.25, ...centre()))
      document.getElementById('zoom-out').addEventListener('click', () => zoom(0.8, ...centre()))
      document.getElementById('fit').addEventListener('click', fit)
      window.addEventListener('resize', fit)

      // ----- selection and highlighting ----------------------------------------------------------
      function select(selection) {
        state.selected = selection
        const hash = selection?.unit
          ? `#unit=${encodeURIComponent(selection.unit)}`
          : selection?.edge
            ? `#edge=${encodeURIComponent(selection.edge)}`
            : ' '
        history.replaceState(null, '', hash === ' ' ? location.pathname + location.search : hash)
        render()
      }

      function highlight() {
        const selected = state.selected?.unit ?? null
        const up = selected ? reach(selected, 'up') : new Set()
        const down = selected ? reach(selected, 'down') : new Set()
        const query = state.query
        const matching = new Set(
          stack.units.filter((unit) => matchesOf(unit, query).length).map((unit) => unit.name),
        )
        for (const [name, element] of nodeElements) {
          element.classList.toggle('selected', name === selected)
          element.classList.toggle('up', up.has(name))
          element.classList.toggle('down', down.has(name))
          element.classList.toggle('match', Boolean(query) && matching.has(name))
          const outside = selected && name !== selected && !up.has(name) && !down.has(name)
          const unmatched = query && !matching.has(name)
          element.classList.toggle('dim', Boolean(outside || unmatched))
        }
        for (const edge of stack.edges) {
          const element = edgeElements.get(edgeId(edge))
          const upward = selected && up.has(edge.from) && (up.has(edge.to) || edge.to === selected)
          const downward =
            selected && down.has(edge.to) && (down.has(edge.from) || edge.from === selected)
          element.classList.toggle('up', Boolean(upward))
          element.classList.toggle('down', Boolean(downward))
          element.classList.toggle('selected', state.selected?.edge === edgeId(edge))
          element.classList.toggle('hidden', !state.order && edge.kind === 'order')
          const quiet =
            (selected && !upward && !downward) ||
            (query && !(matching.has(edge.from) && matching.has(edge.to))) ||
            (state.selected?.edge && state.selected.edge !== edgeId(edge))
          element.classList.toggle('dim', Boolean(quiet))
          const label = labelElements.get(edgeId(edge))
          if (label) {
            for (const name of ['dim', 'hidden'])
              label.classList.toggle(name, element.classList.contains(name))
          }
        }
      }

      // ----- the panel ---------------------------------------------------------------------------
      const panel = document.getElementById('panel')

      function overview() {
        const warnings = stack.units.filter((unit) => unit.warnings.length)
        const resources = stack.units.reduce((sum, unit) => sum + resourceCount(unit), 0)
        const query = state.query
        const matches = query
          ? stack.units
              .map((unit) => [unit, matchesOf(unit, query)])
              .filter(([, found]) => found.length)
          : []
        return [
          h('h2', {}, stack.environment),
          h(
            'p',
            { class: 'muted' },
            `${plural(stack.units.length, 'unit')}, ${plural(stack.edges.length, 'dependency', 'dependencies')}, ${plural(resources, 'resource')}. `,
            'Read from the checkout alone: values that need a run, such as other units’ outputs and secrets, are shown as written.',
          ),
          query
            ? [
                h('h3', {}, `Matches for “${query}”`),
                matches.length
                  ? h(
                      'ul',
                      { class: 'plain' },
                      matches.map(([unit, found]) =>
                        h(
                          'li',
                          {},
                          unitChip(unit.name),
                          ' ',
                          h(
                            'span',
                            { class: 'muted' },
                            found.slice(0, 6).join(', ') +
                              (found.length > 6 ? ` and ${found.length - 6} more` : ''),
                          ),
                        ),
                      ),
                    )
                  : h('p', { class: 'muted' }, 'Nothing matches.'),
              ]
            : null,
          stack.cycle.length
            ? h(
                'div',
                { class: 'warnings' },
                h('strong', {}, 'Dependency cycle: '),
                stack.cycle.join(', '),
                '. Terragrunt refuses to run these units.',
              )
            : null,
          h('h3', {}, 'Apply order'),
          h(
            'p',
            { class: 'muted' },
            'Each round runs once the rounds before it are applied; a destroy runs them backwards.',
          ),
          h(
            'ol',
            { class: 'rounds' },
            stack.rounds.map((round) =>
              h(
                'li',
                {},
                h(
                  'span',
                  { class: 'chips' },
                  round.map((name) => unitChip(name)),
                ),
              ),
            ),
          ),
          warnings.length
            ? [
                h('h3', {}, 'Warnings'),
                h(
                  'ul',
                  { class: 'plain' },
                  warnings.map((unit) =>
                    h(
                      'li',
                      {},
                      unitChip(unit.name),
                      h(
                        'ul',
                        {},
                        unit.warnings.map((warning) => h('li', {}, warning)),
                      ),
                    ),
                  ),
                ),
              ]
            : null,
          h('h3', {}, 'Legend'),
          h(
            'div',
            { class: 'legend' },
            lineSample(null),
            h('span', {}, 'A solid line passes outputs; its number counts them.'),
            lineSample('5 4'),
            h('span', {}, 'A dashed line only orders: the unit waits, reading nothing.'),
            h('span', {
              class: 'swatch',
              style: 'border-color: var(--up); background: var(--up-soft)',
            }),
            h('span', {}, 'What the selected unit waits for, directly or not.'),
            h('span', {
              class: 'swatch',
              style: 'border-color: var(--down); background: var(--down-soft)',
            }),
            h('span', {}, 'What a change of the selected unit can reach.'),
          ),
          h(
            'p',
            { class: 'faint' },
            'Click a unit or a line. Drag to pan, scroll to zoom, Esc to go back, / to search.',
          ),
        ]
      }

      function lineSample(dash) {
        const line = s('line', {
          x1: 0,
          y1: 5,
          x2: 30,
          y2: 5,
          stroke: 'var(--edge)',
          'stroke-width': 2,
        })
        if (dash) line.setAttribute('stroke-dasharray', dash)
        return s('svg', { width: 30, height: 10, 'aria-hidden': 'true' }, line)
      }

      // A comment's lines joined into its paragraphs, which blank lines separate
      const paragraphs = (text, kind = '') =>
        text
          .split(/\n\s*\n/)
          .map((paragraph) => h('p', { class: kind }, paragraph.replace(/\s*\n\s*/g, ' ')))

      // An expression written over several lines, without the indentation of the file it came from
      function dedent(text) {
        const [head, ...rest] = text.split('\n')
        const indents = rest
          .filter((line) => line.trim())
          .map((line) => line.match(/^ */)[0].length)
        const cut = Math.min(...indents, Infinity)
        return [head, ...rest.map((line) => line.slice(Math.max(0, cut - 2)))].join('\n')
      }

      function valueCell(entry) {
        if (entry.known) {
          return h(
            'td',
            { title: entry.expression },
            h('pre', {}, format(entry.value)),
            entry.overrides.map((name) => [' ', tag(`${name} overrides`, 'accent')]),
          )
        }
        return h('td', {}, h('pre', {}, dedent(entry.expression)), tag('computed at run'))
      }

      function unitPanel(unit) {
        const up = reach(unit.name, 'up')
        const down = reach(unit.name, 'down')
        const incoming = stack.edges.filter((edge) => edge.to === unit.name)
        const outgoing = stack.edges.filter((edge) => edge.from === unit.name)
        const module = unit.module
        const describe = (label, text) =>
          text ? h('div', {}, h('h3', {}, label), paragraphs(text)) : null
        return [
          h(
            'div',
            { class: 'back' },
            h('button', { class: 'link', onclick: () => select(null) }, '← Overview'),
          ),
          h('h2', {}, unit.name),
          h(
            'p',
            { class: 'muted mono' },
            unit.source,
            module ? ` → ${module.path}` : unit.moduleSource ? ` → ${unit.moduleSource}` : '',
          ),
          module
            ? h(
                'div',
                { class: 'chips' },
                module.providers.map((p) =>
                  h('span', { class: 'chip' }, `${p.source} ${p.version ?? ''}`),
                ),
              )
            : null,
          unit.warnings.length
            ? h(
                'div',
                { class: 'warnings' },
                h('strong', {}, plural(unit.warnings.length, 'warning')),
                h(
                  'ul',
                  {},
                  unit.warnings.map((warning) => h('li', {}, warning)),
                ),
              )
            : null,
          describe('In the stack', unit.description),
          describe('The unit', unit.unitDescription),
          describe('The module', module?.description),
          h('h3', {}, 'Blast radius'),
          h(
            'p',
            {},
            up.size
              ? [
                  `Waits for ${plural(up.size, 'unit')}: `,
                  h(
                    'span',
                    { class: 'chips' },
                    [...up].map((n) => unitChip(n, 'up')),
                  ),
                ]
              : h('span', { class: 'muted' }, 'Waits for nothing: it runs in the first round.'),
          ),
          h(
            'p',
            {},
            down.size
              ? [
                  `A change can reach ${plural(down.size, 'unit')}: `,
                  h(
                    'span',
                    { class: 'chips' },
                    [...down].map((n) => unitChip(n, 'down')),
                  ),
                ]
              : h('span', { class: 'muted' }, 'Nothing depends on it.'),
          ),

          section(
            'Reads from',
            incoming.length,
            true,
            incoming.length
              ? h(
                  'table',
                  { class: 'auto' },
                  h(
                    'tr',
                    {},
                    h('th', {}, 'Unit'),
                    h('th', {}, 'Output → input'),
                    h('th', {}, 'Mock'),
                  ),
                  incoming.flatMap((edge) =>
                    edge.outputs.length
                      ? edge.outputs.map((o, index) =>
                          h(
                            'tr',
                            {},
                            h('td', {}, index === 0 ? unitChip(edge.from, 'up') : null),
                            h('td', { class: 'mono' }, `${o.output} → ${o.input}`),
                            h(
                              'td',
                              {},
                              o.mock === null
                                ? h('span', { class: 'faint' }, 'none')
                                : h('code', {}, format(o.mock)),
                            ),
                          ),
                        )
                      : [
                          h(
                            'tr',
                            {},
                            h('td', {}, unitChip(edge.from, 'up')),
                            h('td', { colspan: 2, class: 'muted' }, 'order only'),
                          ),
                        ],
                  ),
                )
              : h('p', { class: 'muted' }, 'No other unit.'),
          ),
          section(
            'Read by',
            outgoing.length,
            true,
            outgoing.length
              ? h(
                  'table',
                  {},
                  h('tr', {}, h('th', {}, 'Unit'), h('th', {}, 'Output → input')),
                  outgoing.flatMap((edge) =>
                    edge.outputs.length
                      ? edge.outputs.map((o, index) =>
                          h(
                            'tr',
                            {},
                            h('td', {}, index === 0 ? unitChip(edge.to, 'down') : null),
                            h('td', { class: 'mono' }, `${o.output} → ${o.input}`),
                          ),
                        )
                      : [
                          h(
                            'tr',
                            {},
                            h('td', {}, unitChip(edge.to, 'down')),
                            h('td', { class: 'muted' }, 'order only'),
                          ),
                        ],
                  ),
                )
              : h('p', { class: 'muted' }, 'No other unit.'),
          ),
          section(
            'Values from the stack',
            unit.values.length,
            true,
            unit.values.length
              ? h(
                  'table',
                  {},
                  unit.values.map((entry) =>
                    h('tr', {}, h('td', { class: 'key mono' }, entry.key), valueCell(entry)),
                  ),
                )
              : h('p', { class: 'muted' }, 'None.'),
          ),
          section(
            'Inputs to the module',
            unit.inputs.length,
            false,
            h(
              'table',
              {},
              unit.inputs.map((input) =>
                h(
                  'tr',
                  {},
                  h(
                    'td',
                    { class: 'key' },
                    h('span', { class: 'mono' }, input.name),
                    ' ',
                    tag(input.from),
                  ),
                  input.outputs.length
                    ? h(
                        'td',
                        {},
                        input.outputs.map((o) =>
                          h(
                            'div',
                            { class: 'mono' },
                            `${o.input} ← `,
                            unitChip(o.unit, 'up'),
                            `.${o.output}`,
                          ),
                        ),
                      )
                    : valueCell(input),
                ),
              ),
            ),
          ),
          module
            ? [
                section(
                  'Resources',
                  module.resources.length,
                  true,
                  h(
                    'ul',
                    { class: 'plain' },
                    module.resources.map((r) =>
                      h(
                        'li',
                        {},
                        h('span', { class: 'mono' }, r.address),
                        r.repeat ? [' ', h('span', { class: 'faint mono' }, r.repeat)] : null,
                      ),
                    ),
                  ),
                ),
                section(
                  'Variables',
                  module.variables.length,
                  false,
                  h(
                    'table',
                    {},
                    module.variables.map((v) =>
                      h(
                        'tr',
                        {},
                        h(
                          'td',
                          { class: 'key' },
                          h('div', { class: 'mono' }, v.name),
                          v.type ? h('div', { class: 'faint mono' }, v.type) : null,
                        ),
                        h(
                          'td',
                          {},
                          v.description ? h('div', {}, v.description) : null,
                          h(
                            'div',
                            { class: 'chips' },
                            v.setBy
                              ? tag(`set by ${v.setBy}`)
                              : v.required
                                ? tag('not set', 'warn')
                                : tag('default'),
                            v.default !== null ? tag(`default ${v.default}`) : null,
                            v.sensitive ? tag('sensitive') : null,
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
                section(
                  'Outputs',
                  module.outputs.length,
                  true,
                  module.outputs.length
                    ? h(
                        'table',
                        {},
                        module.outputs.map((o) =>
                          h(
                            'tr',
                            {},
                            h(
                              'td',
                              { class: 'key' },
                              h('span', { class: 'mono' }, o.name),
                              o.sensitive ? [' ', tag('sensitive')] : null,
                            ),
                            h(
                              'td',
                              {},
                              o.description ? h('div', {}, o.description) : null,
                              o.consumers.length
                                ? h(
                                    'div',
                                    { class: 'chips' },
                                    o.consumers.map((c) =>
                                      h(
                                        'span',
                                        {},
                                        unitChip(c.unit, 'down'),
                                        h('span', { class: 'mono faint' }, ` .${c.input}`),
                                      ),
                                    ),
                                  )
                                : h('div', { class: 'faint' }, 'Read by no unit of the stack.'),
                            ),
                          ),
                        ),
                      )
                    : h('p', { class: 'muted' }, 'None.'),
                ),
              ]
            : null,
          section(
            'Includes',
            unit.includes.length,
            false,
            unit.includes.length
              ? unit.includes.map((include) =>
                  h(
                    'div',
                    {},
                    h(
                      'p',
                      {},
                      h('strong', {}, include.name),
                      ' ',
                      h('span', { class: 'mono muted' }, include.file),
                    ),
                    include.inputs.length
                      ? h(
                          'p',
                          { class: 'muted' },
                          'Inputs: ',
                          include.inputs.map((i) => [h('code', {}, i), ' ']),
                        )
                      : null,
                    include.generates.length
                      ? h(
                          'p',
                          { class: 'muted' },
                          'Generates: ',
                          include.generates.map((g) => [h('code', {}, g), ' ']),
                        )
                      : null,
                    include.description ? paragraphs(include.description, 'faint') : null,
                  ),
                )
              : h('p', { class: 'muted' }, 'None.'),
          ),
        ]
      }

      function edgePanel(id) {
        const edge = stack.edges.find((candidate) => edgeId(candidate) === id)
        if (!edge) return overview()
        return [
          h(
            'div',
            { class: 'back' },
            h('button', { class: 'link', onclick: () => select(null) }, '← Overview'),
          ),
          h('h2', {}, unitChip(edge.from, 'up'), ' → ', unitChip(edge.to, 'down')),
          edge.kind === 'data'
            ? [
                h(
                  'p',
                  { class: 'muted' },
                  `${edge.to} reads ${plural(edge.outputs.length, 'output')} of ${edge.from}, and is applied after it.`,
                ),
                h(
                  'table',
                  {},
                  h(
                    'tr',
                    {},
                    h('th', {}, 'Output'),
                    h('th', {}, 'Input'),
                    h('th', {}, 'Mock while unapplied'),
                  ),
                  edge.outputs.map((o) =>
                    h(
                      'tr',
                      {},
                      h('td', { class: 'mono' }, o.output),
                      h('td', { class: 'mono' }, o.input),
                      h(
                        'td',
                        {},
                        o.mock === null
                          ? h('span', { class: 'faint' }, 'none')
                          : h('code', {}, format(o.mock)),
                      ),
                    ),
                  ),
                ),
              ]
            : h(
                'p',
                { class: 'muted' },
                `${edge.to} is applied after ${edge.from} and reads none of its outputs: it waits for what ${edge.from} writes elsewhere, such as secrets.`,
              ),
        ]
      }

      function render() {
        highlight()
        const selected = state.selected
        let content
        if (selected?.unit && units.has(selected.unit))
          content = unitPanel(units.get(selected.unit))
        else if (selected?.edge) content = edgePanel(selected.edge)
        else content = overview()
        panel.replaceChildren(...[content].flat(Infinity).filter(Boolean))
      }

      // ----- start -------------------------------------------------------------------------------
      const search = document.getElementById('search')
      search.addEventListener('input', () => {
        state.query = search.value.trim().toLowerCase()
        render()
      })
      document.getElementById('order').addEventListener('change', (event) => {
        state.order = event.target.checked
        render()
      })
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (document.activeElement === search && search.value) {
            search.value = ''
            state.query = ''
            render()
          } else {
            select(null)
          }
        } else if (event.key === '/' && document.activeElement !== search) {
          event.preventDefault()
          search.focus()
        }
      })

      drawGraph()
      fit()
      const hash = new URLSearchParams(location.hash.slice(1))
      state.selected = hash.get('unit')
        ? { unit: hash.get('unit') }
        : hash.get('edge')
          ? { edge: hash.get('edge') }
          : null
      render()
    </script>
  </body>
</html>
