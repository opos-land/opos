# The local Supabase stack (docs/PLAN.md, 10 and 12). Secrets and addresses come from
# supabase/.env through env(), which `pnpm infra:init` writes. Never `supabase link`.
project_id = "opos"

# The Data API is off; the local gateway still serves Auth at /auth/v1.
[api]
enabled = false
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Drizzle migrates and `pnpm db:seed` seeds.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[studio]
enabled = true
port = 54323

# Mailpit catches the API's mail.
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325

[auth]
enabled = true
site_url = "env(SITE_URL)"
# The last three are temporary, for the sign-in of the current frontends; they leave with it.
additional_redirect_urls = [
  "env(PORTAL_CONFIRM_URL)",
  "env(PANEL_CONFIRM_URL)",
  "env(GOOGLE_CALLBACK_URL)",
  "http://opos.localhost:5174/auth/callback",
  "http://opos.localhost:5174/reset-password",
  "http://panel.opos.localhost:5173/auth/callback",
]
jwt_expiry = 900
# The local ES256 key, which `pnpm infra:init` creates and git never sees.
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

# The tests sign in, verify and refresh many times from one address.
[auth.rate_limit]
sign_in_sign_ups = 10000
token_verifications = 10000
token_refresh = 10000

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_expiry = 3600

[auth.sms]
enable_signup = false

# Every email goes through the API's send-email hook.
[auth.hook.send_email]
enabled = true
uri = "env(SEND_EMAIL_HOOK_URI)"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

# Empty unless someone works on Google sign-in.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.mfa]
max_enrolled_factors = 1

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false
